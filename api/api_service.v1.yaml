openapi: 3.0.2
info:
  title: P2M API
  description: P2M API document
  version: 1.0.0
  contact:
    name: COM
servers:
  - url: '{host}/api/v1'
    variables:
      host:
        default: 'http://localhost:38081'
        enum:
          - 'http://localhost:38081'

paths:
  /ping:
    get:
      responses:
        '200':
          description: pet response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
  /login:
    post:
      tags:
        - Users
      summary: User login
      description: Logs in a user and returns an access token and refresh token.
      parameters:
        - $ref: "#/components/parameters/request_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginBody"
      responses:
        '200':
          $ref: "#/components/responses/UserLoginResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
      operationId: internal_userLogin
  /logout:
    post:
      tags:
        - Users
      summary: User logout
      description: Logs out a user.
      parameters:
        - $ref: "#/components/parameters/request_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenBody"
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '401':
          $ref: "#/components/responses/Unauthorized"
      operationId: internal_userLogout
  /refresh-token:
    post:
      tags:
        - Users
      summary: Renew refresh_token and access token
      description: Refresh an access token.
      parameters:
        - $ref: "#/components/parameters/request_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenBody"
      responses:
        '200':
          $ref: "#/components/responses/RefreshTokenResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '400':
          $ref: "#/components/responses/BadRequest"
      operationId: internal_refreshToken
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Get all users (only admin)
      parameters:
        - $ref: "#/components/parameters/including_deactivates"
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
