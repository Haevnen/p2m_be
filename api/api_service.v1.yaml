openapi: 3.0.2
info:
  title: P2M API
  description: P2M API document
  version: 1.0.0
  contact:
    name: COM
servers:
  - url: '{host}/api/v1'
    variables:
      host:
        default: 'http://localhost:38081'
        enum:
          - 'http://localhost:38081'

paths:
  /login:
    post:
      tags:
        - Users
      summary: User login
      description: Logs in a user and returns an access token and refresh token.
      parameters:
        - $ref: "#/components/parameters/request_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginBody"
      responses:
        '200':
          $ref: "#/components/responses/UserLoginResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
      operationId: internal_userLogin
  /logout:
    post:
      tags:
        - Users
      summary: User logout
      description: Logs out a user.
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/request_id"
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successfully"
                required:
                  - message
        '401':
          $ref: "#/components/responses/Unauthorized"
      operationId: internal_userLogout
  /refresh-token:
    post:
      tags:
        - Users
      summary: Renew refresh_token and access token
      description: Refresh an access token.
      parameters:
        - $ref: "#/components/parameters/request_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
      responses:
        '200':
          description: Successful refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    description: uuid string
                    type: string
                    example: "123e4567-e89b-12d3-a456-426655440000"
                  access_token:
                    description: jwt string
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
                  refresh_token:
                    description: jwt string
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
                  refresh_token_expired_at:
                    description: timestamp
                    type: string
                    example: "2022-01-01T00:00:00Z"
                required:
                  - session_id
                  - access_token
                  - refresh_token
                  - refresh_token_expired_at
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
      operationId: internal_refreshToken
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Get all users
      parameters:
        - $ref: "#/components/parameters/including_deactivates"
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
      operationId: internal_getAllUsers
  /users/register:
    post:
      tags:
        - Users
      summary: Register new user
      description: Register new user
      parameters:
        - $ref: "#/components/parameters/request_id"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Register successfully"
                required:
                  - message
        '401':
          $ref: "#/components/responses/Unauthorized"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
      operationId: internal_registerUser
  /users/{name}:
    delete:
      tags:
        - Users
      summary: Delete user by name
      description: Delete user by name
      parameters:
        - $ref: "#/components/parameters/request_id"
        - name: name
          in: path
          description: User nickname
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Delete successfully"
                required:
                  - message
        '401':
          $ref: "#/components/responses/Unauthorized"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '403':
          $ref: "#/components/responses/Forbidden"
      operationId: internal_removeUser
tags:
  - name: Users
    description: Users API
  - name: Tasks
    description: Tasks API
  - name: Clients
    description: Clients API
  - name: Dashboard
    description: Dashboard API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Specify Access Token
    BasicAuth:
      type: http
      scheme: basic
      description: Basic Authentication
  parameters:
    session_id:
      name: X-Session-Id
      in: header
      schema:
        format: uuid
        type: string
      required: true
    request_id:
      name: X-Request-Id
      in: header
      schema:
        format: ascii
        type: string
      required: true
    including_deactivates:
      name: including_deactivates
      in: query
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Error if API token key is not set or invalid or has already expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Access forbidden (only admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserLoginResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              session_id:
                description: uuid string
                type: string
                example: "123e4567-e89b-12d3-a456-426655440000"
              access_token:
                description: jwt string
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
              refresh_token:
                description: jwt string
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
              refresh_token_expired_at:
                description: timestamp
                type: string
                example: "2022-01-01T00:00:00Z"
              user:
                $ref: "#/components/schemas/UserWithoutPass"
            required:
              - session_id
              - refresh_token
              - access_token
              - user

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: "Error message"
      required:
        - message
    ContractType:
      type: string
      enum:
        - FULLTIME
        - FREELANCE
      example: FULLTIME
    UserWithoutPass:
      type: object
      properties:
        nick_name:
          type: string
          example: "nickname"
        email:
          type: string
          example: "email"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        is_active:
          type: boolean
          example: true
        is_admin:
          type: boolean
          example: false
      required:
        - nick_name
        - email
        - contract_type
        - is_active
        - is_admin
    User:
      type: object
      properties:
        nick_name:
          type: string
          example: "nickname"
        email:
          type: string
          example: "email"
        password:
          type: string
          example: "password"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        is_active:
          type: boolean
          example: true
        is_admin:
          type: boolean
          example: false
      required:
        - nick_name
        - email
        - contract_type
        - is_active
        - is_admin
    UserLoginBody:
      type: object
      properties:
        nick_name:
          type: string
          example: "nickname"
        password:
          type: string
          example: "password"
      required:
        - email
        - password
      example:
        email: email
        password: password