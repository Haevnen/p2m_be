tags:
  - name: Users
    description: Users API
  - name: Tickets
    description: Tickets API
  - name: Clients
    description: Clients API
  - name: Dashboard
    description: Dashboard API
  - name: Links
    description: Ticket Links API
  - name: Comments
    description: Ticket Comments API
  - name: Histories
    description: Ticket Histories API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Specify Access Token
    BasicAuth:
      type: http
      scheme: basic
      description: Basic Authentication
  parameters:
    session_id:
      name: X-Session-Id
      in: header
      schema:
        format: uuid
        type: string
      required: true
    request_id:
      name: X-Request-Id
      in: header
      schema:
        format: ascii
        type: string
      required: true
    including_deactivates:
      name: including_deactivates
      in: query
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Error if API token key is not set or invalid or has already expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Access forbidden (only admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnexpectedError:
      description: Unexpected errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: internal_error
            title: internal error
    UserLoginResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            title: UserLoginResponse
            type: object
            properties:
              session_id:
                description: uuid string
                type: string
                example: "123e4567-e89b-12d3-a456-426655440000"
              access_token:
                description: jwt string
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
              access_token_expired_at:
                description: timestamp
                type: string
                example: "2022-01-01T00:00:00Z"
              refresh_token:
                description: jwt string
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
              refresh_token_expired_at:
                description: timestamp
                type: string
                example: "2022-01-01T00:00:00Z"
              user:
                $ref: "#/components/schemas/UserWithoutPass"
            required:
              - session_id
              - refresh_token
              - access_token
              - user
              - refresh_token_expired_at
              - access_token_expired_at
    RefreshTokenResponse:
      description: Refresh token response
      content:
        application/json:
          schema:
            title: RefreshTokenResponse
            type: object
            properties:
              access_token:
                description: jwt string
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
              access_token_expired_at:
                description: timestamp
                type: string
                example: "2022-01-01T00:00:00Z"
            required:
              - access_token
              - access_token_expired_at
    LinkResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LinkResponse"
    CommentResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommentResponse"
    HistoryResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HistoryResponse"
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
          enum:
            - validation_failed
            - permission_denied
            - request_not_found
            - internal_error
          default: internal_error
        code:
          description: Custom error code
          type: string
        title:
          description: Error Summary
          type: string
        detail:
          description: Detailed error description
          type: string
      required:
        - type
        - code
        - title
        - detail
    ContractType:
      type: string
      enum:
        - FULLTIME
        - FREELANCE
      example: FULLTIME
    Status:
      type: string
      enum:
        - BACKLOG
        - IN_PROGRESS
        - READY_TO_QC
        - QC_VERIFYING
        - QC_DONE
        - DONE
    CreatedBy:
      type: string
      enum:
        - MANUAL
        - AUTO
    Priority:
      type: string
      enum:
        - NORMAL
        - HIGH
    UserWithoutPass:
      type: object
      properties:
        nick_name:
          type: string
          example: "nickname"
        email:
          type: string
          example: "email"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        is_active:
          type: boolean
          example: true
        is_admin:
          type: boolean
          example: false
      required:
        - nick_name
        - email
        - contract_type
        - is_active
        - is_admin
    User:
      type: object
      properties:
        nick_name:
          type: string
          example: "nickname"
        email:
          type: string
          example: "email"
        password:
          type: string
          example: "password"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        is_active:
          type: boolean
          example: true
        is_admin:
          type: boolean
          example: false
      required:
        - nick_name
        - email
        - contract_type
        - is_active
        - is_admin
    UserLoginBody:
      type: object
      properties:
        nick_name:
          type: string
          example: "nickname"
        password:
          type: string
