openapi: 3.0.2
info:
  contact:
    name: COM
  description: P2M API document
  title: P2M API
  version: 1.0.0
servers:
- url: '{host}/api/v1'
  variables:
    host:
      default: http://localhost:38081
      enum:
      - http://localhost:38081
tags:
- description: Users API
  name: Users
- description: Tickets API
  name: Tickets
- description: Clients API
  name: Clients
- description: Dashboard API
  name: Dashboard
- description: Ticket Links API
  name: Links
- description: Ticket Comments API
  name: Comments
- description: Ticket Histories API
  name: Histories
paths:
  /ping:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
          description: pet response
  /login:
    post:
      description: Logs in a user and returns an access token and refresh token.
      operationId: internal_userLogin
      parameters:
      - explode: false
        in: header
        name: X-Request-Id
        required: true
        schema:
          format: ascii
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
          description: Successful operation
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error if API token key is not set or invalid or has already
            expired
      summary: User login
      tags:
      - Users
  /logout:
    post:
      description: Logs out a user.
      operationId: internal_userLogout
      parameters:
      - explode: false
        in: header
        name: X-Request-Id
        required: true
