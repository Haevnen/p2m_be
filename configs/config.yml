# Application information
app:
  name: "P2M API"
  mode: "debug" # debug, release
  # file, console
  logmode: console
  # InfoLevel, WarnLevel, ErrorLevel, FatalLevel, PanicLevel
  loglevel: InfoLevel
  logfile: "/var/log/p2m/p2m.log"

# Server config
server:
  host: 0.0.0.0 # if you want to run this API server from a Docker container, set it to 0.0.0.0
  port: 8000
  monitor: 8080

# Shipping MySQL Server config
database:
  host: localhost # if you want to run this API server from a Docker container, set it to "db", otherwise set it to "localhost"
  port: 33306 # if you want to run this API server from a Docker container, set it to 3306, otherwise set it to 33306
  dbname: p2m_db
  username: root
  password: root
